# Active configuration — consolidated 2026-10-12
manager:
  name: Manager
  owner: Anant
  address_as: Sir
  personality:
  - worker
  - well-wisher
  - ideal-servant
  - best-friend
  language: en
  voice_enrollment_done: false
  hardware_fingerprint: null
server:
  host: 127.0.0.1
  port: 8000
voice:
  stt_engine: whisper
  whisper_model: base
  voice_gender: female
  tts_engine: pyttsx3
  tts_voice: en-US-AriaNeural
  wake_word: hey manager
  alternative_wake: manager
  enabled: true
ai_router:
  primary_reasoning: claude
  primary_search: gemini
  primary_image: stability
  primary_code: claude
  primary_writing: claude
  primary_translation: gemini
  fallback_chain:
  - claude
  - gemini
  - gpt4o
  - mistral
  free_tier_only: true
  local_first: true
  local_only: false
  request_timeout_seconds: 90
api_keys:
  anthropic: null
  google_ai: null
  openai: null
  elevenlabs: null
  stability_ai: null
  zerodha_api_key: null
  zerodha_secret: null
  huggingface: null
trading:
  mode: paper
  confidence_threshold: 0.85
  min_agents_consensus: 3
  max_position_size_pct: 5
  starting_capital: 10000
  exchanges:
  - zerodha
  crypto_exchanges: []
security:
  encryption: aes-256
  privacy_mode: strict
  block_api_training: true
  encrypt_local_data: true
  identity_factors:
  - hardware
  - voice
  - passphrase
  passphrase_backup: true
vpn:
  provider: tailscale
  enabled: false
  tailscale_auth_key: null
chrome:
  remote_debugging_port: 9222
  user_data_path: ./logs/chrome_automation
  profiles:
    main: Default
    work: Profile 1
    personal: Profile 2
  connect_existing: false
social:
  instagram_personal: null
  instagram_professional: null
  whatsapp: null
  facebook: null
  auto_post: false
storage:
  db_path: ./logs/manager.db
  backup_path: ./backups/
  log_path: ./logs/
  max_memory_mb: 2048
  tasks_path: ./logs/tasks.db
ui:
  theme: cinematic-dark
  accent_color: '#00d4ff'
  show_agent_status: true
  auto_open_browser: true
self_heal:
  enabled: true
  log_scan_interval: 30
  auto_fix: false
  backup_before_fix: true
  notify_sir_on_fix: false
trading_alerts:
  enabled: false
  delivery: whatsapp
  morning_brief_time: 08:00
  evening_report_time: '16:00'
  watchlist:
  - RELIANCE
  - TCS
  - INFY
  - HDFCBANK
  - TATAMOTORS
  price_alerts: []
  whatsapp_number: null
  telegram_chat_id: null
  telegram_bot_token: null
notifications:
  whatsapp_enabled: false
  telegram_enabled: false
  dashboard_enabled: true
voice_override:
  tts_engine: pyttsx3
  whisper_model: base
conversation:
  store_path: ./logs/conversations.db
  max_context_messages: 20
  never_delete: true
health_alerts:
  ram_threshold_pct: 95
  cpu_threshold_pct: 92
  disk_min_free_gb: 15
  cooldown_minutes: 10
auth:
  bypass_in_development: false
  session_ttl_hours: 8
  rate_limit_key_add: 5

